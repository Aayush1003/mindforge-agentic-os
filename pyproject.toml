[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindforge-agentic-os"
version = "0.2.0"
description = "A memory-first, reasoning-rich agentic operating system for deep work and long-horizon thinking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Aayush1003" }
]

[project.scripts]
mindforge = "mindforge.cli:main"

[tool.setuptools]
packages = ["mindforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
